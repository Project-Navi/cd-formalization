name = "CdFormal"
version = "0.2.0"
keywords = ["math"]
defaultTargets = ["CdFormal"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
maxHeartbeats = 200000
# Mathlib standard linter set (docBlame, simpNF, unusedArguments, etc.)
weak.linter.mathlibStandardSet = true
# Style linters (longLine, lambda, dollar, cdot, missingEnd)
linter.style.longLine = true
linter.style.lambdaSyntax = true
linter.style.dollarSyntax = true
linter.style.cdot = true
linter.style.missingEnd = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "CdFormal"

# Statement files: the headline results restated with `sorry` as the specification, compared
# with the library by spec/Check.lean in CI. Not a default target; never imported by CdFormal.
[[lean_lib]]
name = "Spec"
srcDir = "spec"
