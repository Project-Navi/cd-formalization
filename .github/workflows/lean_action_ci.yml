name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lean-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ELAN_HOME: /home/runner/.elan

jobs:
  # CONTRACT: org ruleset requires this exact check name 'build'
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # A pull_request run checks out a merge of the head into the base.
      - name: Record revision
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "event: $EVENT"
          echo "checked out: $(git rev-parse HEAD)"
          if [ "$EVENT" = pull_request ]; then
            echo "pull request head: $PR_HEAD, base: $PR_BASE"
          fi

      - name: Install elan and toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/917c18d0ad52f649c2603dc8b973f5b9fa5f8f43/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "${ELAN_HOME}/bin" >> "${GITHUB_PATH}"
          export PATH="${ELAN_HOME}/bin:${PATH}"
          elan --version
          elan show

      # Pinned dependencies only, under an exact key; project modules are always rebuilt.
      - name: Cache Lake packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: List modules
        run: |
          mods=$(git ls-files 'CdFormal/*.lean' | sed -e 's/\.lean$//' -e 's#/#.#g')
          if [ -z "$mods" ]; then
            echo "::error::no modules under CdFormal/"
            exit 1
          fi
          missing=""
          for m in $mods; do
            echo "module: $m"
            grep -qx "import $m" CdFormal.lean || missing="$missing $m"
          done
          if [ -n "$missing" ]; then
            echo "::error::not imported by CdFormal.lean:$missing"
            exit 1
          fi
          echo "$(echo "$mods" | wc -l) modules, all imported by CdFormal.lean"

      # The root and every tracked module, named explicitly.
      - name: Build (fail on warnings, including sorry)
        id: build
        run: lake build --wfail CdFormal $(git ls-files 'CdFormal/*.lean' | sed -e 's/\.lean$//' -e 's#/#.#g' -e 's/^/+/')

      - name: Lint (Mathlib environment linters)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: lake lint

      # Verify.lean lists the selected declarations, which must include the headline results named
      # below. Each needs exactly one record, and every record may use only propext,
      # Classical.choice and Quot.sound.
      - name: Check axioms
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          lake env lean -DwarningAsError=true CdFormal/Verify.lean 2>&1 | tee "$RUNNER_TEMP/axioms.txt"
          python3 - "$RUNNER_TEMP/axioms.txt" <<'EOF'
          import collections, pathlib, re, sys
          source = pathlib.Path("CdFormal/Verify.lean").read_text(encoding="utf-8")
          expected = re.findall(r"^#print axioms (\S+)\s*$", source, re.M)
          lines = []
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              if line[:1].isspace() and lines:
                  lines[-1] += " " + line.strip()
              else:
                  lines.append(line)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          records, errors = collections.Counter(), []
          for line in lines:
              m = re.fullmatch(r"'(.+)' (?:depends on axioms: \[(.*)\]|does not depend on any axioms)",
                               line)
              if not m:
                  continue
              records[m[1]] += 1
              used = {a.strip() for a in (m[2] or "").split(",") if a.strip()}
              if used - allowed:
                  errors.append(f"{m[1]} uses {sorted(used - allowed)}")
          if not expected:
              errors.append("Verify.lean selects no declarations")
          # Kept here, not in Verify.lean, so that deselecting a headline result fails the check.
          headline = ["SemioticBVP.exists_isWeakCoherentConfiguration",
                      "SemioticBVP.exists_pos_isWeakCoherentConfiguration",
                      "SemioticGraph.exists_pos_graph",
                      "SemioticGraph.exists_pos_graph_of_unweighted",
                      "spectral_characterization_1d", "linfty_bound_algebraic",
                      "monotone_fixed_point_between", "scaling_uniqueness"]
          for name in headline:
              if name not in expected:
                  errors.append(f"headline result {name} is not selected in Verify.lean")
          for name, n in collections.Counter(expected).items():
              if n > 1:
                  errors.append(f"{name} is selected {n} times")
          for name in dict.fromkeys(expected):
              if records[name] != 1:
                  errors.append(f"{name}: {records[name]} records")
          for name in records.keys() - set(expected):
              errors.append(f"unexpected record for {name}")
          if errors:
              print("::error::axiom check failed")
              print("\n".join(errors))
              sys.exit(1)
          print(f"{len(expected)} selected declarations, including all {len(headline)} headline "
                "results, one record each, using only propext, Classical.choice and Quot.sound.")
          EOF

      # Every Lean name written in inline code in the README and the docs, and every declaration
      # shown in a Lean code block there, must resolve.
      - name: Check documented names
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 - > "$RUNNER_TEMP/DocNames.lean" <<'EOF'
          import pathlib, re, sys
          files = [pathlib.Path("README.md"), *sorted(pathlib.Path("docs").rglob("*.md"))]
          names = set()
          for path in files:
              raw = path.read_text(encoding="utf-8")
              # Declarations shown in Lean code blocks must resolve as well.
              for block in re.findall(r"^```lean\n(.*?)^```", raw, flags=re.S | re.M):
                  names.update(re.findall(
                      r"^(?:theorem|lemma|def|abbrev|structure|class)\s+([^\s(:{\[]+)", block, re.M))
              text = re.sub(r"^```.*?^```", "", raw, flags=re.S | re.M)
              for token in re.findall(r"`([^`\n]+)`", text):
                  if (re.fullmatch(r"[^\W\d][\w'.]*[\w']", token)
                          and re.search(r"[A-Z_.]", token)
                          and token not in {"Prop", "Type", "Sort"}
                          and not re.search(r"\.(lean|md|toml|json|yml|cff)$", token)):
                      names.add(token)
          if not names:
              sys.exit("no documented Lean names found")
          print("import CdFormal")
          for name in sorted(names):
              print(f"#check @{name}")
          EOF
          if ! lake env lean -DwarningAsError=true "$RUNNER_TEMP/DocNames.lean" 2>&1 | tee "$RUNNER_TEMP/docnames.txt"; then
            echo "::error::a documented name does not resolve"
            exit 1
          fi
          echo "$(grep -c '^#check' "$RUNNER_TEMP/DocNames.lean") documented names resolve."

      # No axiom may be declared in any CdFormal module, even one that no selected declaration
      # uses. The check reads the compiled environment, so it cannot be fooled by layout. It first
      # proves it can fail: a module declaring a two-line axiom must be reported.
      - name: Check that no axiom is declared
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cat > "$RUNNER_TEMP/axiom_check.lean" <<'EOF'
          open Lean in
          #eval show CoreM Unit from do
            let env ← getEnv
            let mut found := #[]
            let mut modules := 0
            for mod in env.header.moduleNames, data in env.header.moduleData do
              if mod.getRoot == `CdFormal then
                modules := modules + 1
                for c in data.constants do
                  if c matches .axiomInfo _ then found := found.push c.name
            unless found.isEmpty do throwError "axioms declared in CdFormal: {found}"
            IO.println s!"no axiom declared in any of {modules} CdFormal modules"
          EOF
          fixture=CdFormal/CiAxiomFixture.lean
          trap 'rm -f "$fixture" .lake/build/lib/lean/CdFormal/CiAxiomFixture.*' EXIT
          printf 'import CdFormal.Basic\n\naxiom\n  ciAxiomFixture : False\n' > "$fixture"
          lake build CdFormal.CiAxiomFixture
          { echo 'import CdFormal.CiAxiomFixture'; cat "$RUNNER_TEMP/axiom_check.lean"; } \
            > "$RUNNER_TEMP/SelfTest.lean"
          if lake env lean "$RUNNER_TEMP/SelfTest.lean"; then
            echo "::error::the axiom check did not report a declared axiom"
            exit 1
          fi
          rm -f "$fixture" .lake/build/lib/lean/CdFormal/CiAxiomFixture.*
          { echo 'import CdFormal'; cat "$RUNNER_TEMP/axiom_check.lean"; } > "$RUNNER_TEMP/NoAxioms.lean"
          lake env lean "$RUNNER_TEMP/NoAxioms.lean"

      # Mathlib's header linter only runs inside Mathlib, so check the layout here: copyright
      # header, then imports, then the module docstring.
      - name: Check file headers
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import pathlib, re, subprocess, sys
          files = subprocess.run(["git", "ls-files", "CdFormal.lean", "CdFormal/*.lean"],
                                 capture_output=True, text=True, check=True).stdout.split()
          header = re.compile(r"/-\nCopyright \(c\) 20\d\d [^\n]+\. All rights reserved\.\n"
                              r"Released under Apache 2\.0 license as described in the file LICENSE\.\n"
                              r"Authors: [^\n]*[^.\n]\n-/\n")
          bad = []
          for f in files:
              text = pathlib.Path(f).read_text(encoding="utf-8")
              m = header.match(text)
              if not m:
                  bad.append(f"{f}: copyright header")
                  continue
              rest = [l for l in text[m.end():].splitlines() if l.strip()]
              body = [l for l in rest if not l.startswith("import ")]
              if not body or not body[0].startswith("/-!"):
                  bad.append(f"{f}: no module docstring directly after the imports")
          if not files or bad:
              sys.exit("header check failed:\n  " + "\n  ".join(bad or ["no files"]))
          print(f"{len(files)} files have a copyright header and a module docstring after the imports.")

      # 'sorry' and 'sorryAx' may not appear anywhere in the Lean sources, comments included, and
      # no axiom may be declared.
      - name: Audit placeholders
        if: ${{ !cancelled() }}
        run: |
          files=$(git ls-files 'CdFormal.lean' 'CdFormal/*.lean')
          if [ -z "$files" ]; then
            echo "::error::no Lean sources to audit"
            exit 1
          fi
          status=0
          git grep -n -w -e sorry -e sorryAx -- 'CdFormal.lean' 'CdFormal/*.lean' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::'sorry' or 'sorryAx' appears in the Lean sources"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::placeholder audit did not run (git grep exit $status)"
            exit 1
          fi
          echo "$(echo "$files" | wc -l) files audited; no 'sorry' or 'sorryAx'."
